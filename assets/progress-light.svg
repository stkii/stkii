<svg xmlns="http://www.w3.org/2000/svg" width="860" height="172" viewBox="0 0 860 172" role="img" aria-label="In Progress — SAI: 心理学研究のための分析ソフト / binary: オリジナルのキャラを作成し、作業や雑談、会話することができるアプリ">
  <title>In Progress</title>
  <style>
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .title { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #6e7781; letter-spacing: 1.5px; }
    .name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; font-weight: 700; fill: #1f2328; }
    .desc { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif; font-size: 14px; fill: #6e7781; }
    .rule { stroke: #d0d7de; stroke-width: 1; }
    .dot { fill: #0969da; opacity: 1; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .3 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: 1 } }
  </style>

  <rect class="card" x="0.75" y="0.75" width="858.5" height="170.5" rx="12" />

  <text class="title" x="44" y="44">IN PROGRESS</text>
  <line class="rule" x1="44" y1="60" x2="816" y2="60" />

  <circle class="dot" cx="50" cy="87" r="4" style="animation-delay:0.0s" />
  <text class="name" x="68" y="92">SAI</text>
  <text class="desc" x="190" y="92">心理学研究のための分析ソフト</text>

  <circle class="dot" cx="50" cy="127" r="4" style="animation-delay:1.2s" />
  <text class="name" x="68" y="132">binary</text>
  <text class="desc" x="190" y="132">オリジナルのキャラを作成し、作業や雑談、会話することができるアプリ</text>
</svg>
