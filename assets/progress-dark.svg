<svg xmlns="http://www.w3.org/2000/svg" width="780" height="172" viewBox="0 0 780 172" role="img" aria-label="In Progress — SAI: 心理学研究のための分析ソフト / binary: AIアバターと作業や会話ができるデスクトップアプリ">
  <title>In Progress</title>
  <style>
    .card { fill: #0d1117; stroke: #30363d; }
    .title { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #8b949e; letter-spacing: 1.5px; }
    .name { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; font-weight: 700; fill: #e6edf3; }
    .desc { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif; font-size: 14px; fill: #8b949e; }
    .rule { stroke: #30363d; stroke-width: 1; }
    .dot { fill: #58a6ff; opacity: 1; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .3 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: 1 } }
  </style>

  <rect class="card" x="0.75" y="0.75" width="778.5" height="170.5" rx="12" />

  <text class="title" x="44" y="44">IN PROGRESS</text>
  <line class="rule" x1="44" y1="60" x2="736" y2="60" />

  <circle class="dot" cx="50" cy="87" r="4" style="animation-delay:0.0s" />
  <text class="name" x="68" y="92">SAI</text>
  <text class="desc" x="190" y="92">心理学研究のための分析ソフト</text>

  <circle class="dot" cx="50" cy="127" r="4" style="animation-delay:1.2s" />
  <text class="name" x="68" y="132">binary</text>
  <text class="desc" x="190" y="132">AIアバターと作業や会話ができるデスクトップアプリ</text>
